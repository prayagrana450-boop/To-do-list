
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>To-Do List</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <h1>✨ My To-Do List</h1>
        <p class="subtitle">Plan your day, achieve your goals!</p>

        <div class="input-section">
            <input
                type="text"
                id="taskInput"
                placeholder="What do you need to do?"
                autocomplete="off"
            >
            <button type="button" id="addBtn">+ Add Task</button>
        </div>

        <p id="errorMessage"></p>

        <div class="task-counter">
            <div class="counter total">
                <span>Total Tasks</span>
                <strong id="totalTasks">0</strong>
            </div>

            <div class="counter completed">
                <span>Completed</span>
                <strong id="completedTasks">0</strong>
            </div>
        </div>

        <ul id="taskList"></ul>

        <p id="emptyMessage">🌸 No tasks yet! Add your first task.</p>
    </div>

    <script src="script.js"></script>
</body>
</html>
